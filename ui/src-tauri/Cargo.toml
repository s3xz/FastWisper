[package]
name = "fastwisper-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Hub local do FastWisper"

# Workspace separado: os gates principais nunca compilam GTK/WebKit/Tauri.
[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fw-core = { path = "../../crates/fw-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
toml = "1.1"

[dev-dependencies]
# Daemon fake (o real do fw-core com pipeline e desktop falsos) nos testes.
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
